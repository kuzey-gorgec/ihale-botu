name: Gunluk TED Tarama

on:
  schedule:
    # Her gun 03:00 UTC (TR saatiyle yaklasik 05:00/06:00, yaz/kis saatine gore)
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # Actions sekmesinden manuel de tetiklenebilir

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: ted_ingest.py calistir
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          # Ollama burada calismiyor (GitHub Actions runner'inda yerel model yok);
          # kod Ollama'ya baglanamayinca hizlica Groq'a duser, bu yuzden sorun degil.
        run: python scripts/ted_ingest.py --limit 100
