# Ihale/kaynak listesi - config-driven scraper framework icin taslak.
# Her kaynak: type (aggregator | state_portal | award_registry | reference),
# scope (ne kapsiyor), access (free/paid/api var mi), notes.
#
# Bu dosya "canli" bir dokuman: yeni bir eyalet/portal/Zweckverband
# bulundukca buraya eklenecek. Amac hepsini elle tek tek yazmak degil,
# oncelik sirasina gore en genis kapsayan kaynaklardan basliyoruz.

fiber_aggregators:
  - name: TendiGo Glasfaserausbau
    url: https://tendigo.de/ausschreibungen/glasfaserausbau
    type: aggregator
    scope: "Almanya genelinde aktif glasfaser/breitband ihaleleri - ozel olarak fiber'a odakli"
    access: "Ucretsiz arama/filtre; AI analiz ve otomatik alert ucretli"
    notes: >
      En iyi baslangic noktasi - zaten fiber'a filtrelenmis, awarding body,
      lokasyon, deadline, tahmini hacim gosteriyor. ANCAK sadece acik ihaleleri
      gosteriyor, kazananlari (sonuclanan ihale) GOSTERMIYOR - kazanan bilgisi
      icin award_registries kaynaklarina bakmak gerekiyor.

  - name: DTAD Tiefbau/Glasfaser
    url: https://www.dtad.com/de/ausschreibungen/branchen/tiefbau
    type: aggregator
    scope: "Tiefbau/Erdarbeiten ihaleleri (glasfaser kazi isleri buraya da dusuyor)"
    access: "Ucretli abonelik"
    notes: "Kategori bazli filtre var, bolgeye gore de (orn. /hessen/tiefbau) filtrelenebiliyor"

  - name: Vergabe24
    url: https://www.vergabe24.de
    type: aggregator
    scope: "Genel kamu ihale arama motoru, Bayern kokenli ama Almanya genelini kapsiyor"
    access: "Ucretli abonelik (bazi aramalar ucretsiz)"
    notes: "Vergaberecht sozlugu de var, referans olarak da kullanilabilir"

  - name: service.bund.de Ausschreibungen
    url: https://www.service.bund.de/Content/DE/Ausschreibungen/Suche/Formular.html
    type: aggregator
    scope: "Bund/Land/Kommune genelinde resmi ihale arama - devlet tarafindan isletiliyor"
    access: "Ucretsiz"
    notes: "Resmi kaynak oldugu icin guvenilir, ama UI eski / arama filtreleri sinirli olabilir"

award_registries:
  - name: TED (Tenders Electronic Daily)
    url: https://ted.europa.eu
    type: award_registry
    scope: "AB esik ustu ihaleler (buyuk capli projeler) - hem ilan hem SONUC/Zuschlag bilgisi zorunlu yayinlaniyor"
    access: "Ucretsiz, resmi API mevcut (eForms/OpenData)"
    notes: >
      "Kim kazandi" sorusunun en guvenilir cevabi burada esik ustu projeler icin.
      Kucuk capli yerel Zweckverband ihaleleri esigin altinda kalabilir, o zaman
      bu kaynakta gorunmez.

  - name: Bundesanzeiger Vergabebekanntmachungen
    url: https://www.bundesanzeiger.de
    type: award_registry
    scope: "Esik alti ihalelerin bazilari + resmi bekanntmachung/Zuschlag ilanlari"
    access: "Kismen ucretsiz arama"
    notes: "Esik alti ihalelerde sonuc yayinlama zorunlulugu TED kadar net degil, kapsam degisken"

