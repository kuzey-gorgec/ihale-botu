reference_only:
  # Dogrudan ihale/tedarikci verisi yok ama baglam/dogrulama icin faydali.
  - name: Gigabitförderung (Bund)
    url: https://www.gigabitfoerderung.gov.de
    notes: >
      Sadece yonetmelik/cagri dokumanlari, kazanan/proje listesi yok.
      Bir bolgenin "gigabit destekli" olup olmadigini teyit etmek icin
      referans olarak kullanilabilir, scraping hedefi degil.
  - name: Gigabit.NRW Ausschreibungen
    url: https://www.gigabit.nrw.de/aktuelles/ausschreibungen.html
    notes: "NRW'ye ozel breitband programi duyurulari - state_portals'a ek, NRW icin ikinci kaynak"

